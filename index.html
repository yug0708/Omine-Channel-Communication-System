      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Instrument Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            display: ['Fraunces', 'Georgia', 'serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          colors: {
            'dark-bg': '#000000',
            'dark-card': '#111111',
            'dark-login-bg': '#000000',
            'dark-login-card': '#111111',
            'accent-green': '#00A76F',
            'accent-blue': '#00B8D9',
            'accent-orange': '#F59E0B',
            'accent-cyan': '#00B8D9',
            slate: {
              '50': '#F9F6F2',
              '100': '#F1EDE8',
              '200': '#E8E2DB',

              '700': '#2A2A2A',
              '800': '#1A1A1A',

              '950': '#000000',
            },
            primary: {
              '50': '#F0FDF6',

              '200': '#5BE49B',
              '300': '#34D399',

              '500': '#00A76F',
              '600': '#007867',

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif; }
    table, .tabular-nums { font-variant-numeric: tabular-nums; }

    /* ── Page entry animation ─────────────────────── */
    @keyframes page-fade-up {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .page-enter { animation: page-fade-up 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

    /* ── Stagger children ─────────────────────────── */
    @keyframes stagger-in {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .stagger-item { animation: stagger-in 0.4s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .stagger-item:nth-child(1) { animation-delay: 0.05s; }
    .stagger-item:nth-child(2) { animation-delay: 0.10s; }
    .stagger-item:nth-child(3) { animation-delay: 0.15s; }
    .stagger-item:nth-child(4) { animation-delay: 0.20s; }
    .stagger-item:nth-child(5) { animation-delay: 0.25s; }
    .stagger-item:nth-child(6) { animation-delay: 0.30s; }

    /* ── Slide in from right ──────────────────────── */
    @keyframes slide-in-right {
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .animate-slide-in-right {
      animation: slide-in-right 0.3s ease-out forwards;
    }

    @keyframes fade-in-up {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in-up {
      animation: fade-in-up 0.5s ease-out forwards;
    }

    @keyframes login-drift {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(28px, 22px, 0) scale(1.06); }
    }

    @keyframes login-drift-alt {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-24px, -18px, 0) scale(1.08); }
    }

    @keyframes login-dot {
      0%, 100% { transform: translateY(0); opacity: 0.35; }
      50% { transform: translateY(-14px); opacity: 0.8; }
    }

    .login-orb { animation: login-drift 16s ease-in-out infinite; }
    .login-orb-alt { animation: login-drift-alt 18s ease-in-out infinite; }
    .login-dot { animation: login-dot 7s ease-in-out infinite; }

    .dashboard-mesh {
      background-image: none;
    }

    .dark .dashboard-mesh {
      background-image: none;
    }

    .dashboard-grid-bg {
      background-size: 24px 24px;
      background-image: linear-gradient(to right, rgba(148, 163, 184, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
    }

    .dark .dashboard-grid-bg {
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
    .hide-scrollbar {
      scrollbar-width: none;        /* Firefox */
      -ms-overflow-style: none;     /* IE / Edge */
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;                /* Chrome / Safari / Opera */
    }
  </style>
