<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CommuniDesk - Unified Comms Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Public Sans Variable"', 'ui-sans-serif', 'system-ui', 'sans-serif', '"Apple Color Emoji"', '"Segoe UI Emoji"', '"Segoe UI Symbol"', '"Noto Color Emoji"'],
          },
          colors: {
            'dark-bg': '#0B1120',
            'dark-card': '#111827',
            'dark-login-bg': '#0F172A',
            'dark-login-card': '#1E293B',
            'accent-green': '#10B981',
            'accent-blue': '#34D399',
            'accent-orange': '#F59E0B',
            'accent-cyan': '#0EA5E9',
            slate: {
              '950': '#0d1117',
            },
            primary: {
              '50': '#f0fdfa',
              '100': '#ccfbf1',
              '200': '#99f6e4',
              '300': '#5eead4',
              '400': '#2dd4bf',
              '500': '#14b8a6',
              '600': '#0d9488',
              '700': '#0f766e',
              '800': '#115e59',
              '900': '#134e4a',
              '950': '#042f2e',
            },
          }
        }
      }
    }
  </script>
  <style>
    @keyframes slide-in-right {
      from {
        transform: translateX(100%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .animate-slide-in-right {
      animation: slide-in-right 0.3s ease-out forwards;
    }

    @keyframes fade-in-up {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in-up {
      animation: fade-in-up 0.5s ease-out forwards;
    }

    .dashboard-mesh {
      background-image:
        radial-gradient(at 0% 0%, rgba(52, 211, 153, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(14, 165, 233, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
    }

    .dark .dashboard-mesh {
      background-image:
        radial-gradient(at 0% 0%, rgba(52, 211, 153, 0.15) 0px, transparent 45%),
        radial-gradient(at 100% 50%, rgba(59, 130, 246, 0.08) 0px, transparent 45%),
        radial-gradient(at 50% 100%, rgba(16, 185, 129, 0.06) 0px, transparent 45%);
    }

    .dashboard-grid-bg {
      background-size: 24px 24px;
      background-image: linear-gradient(to right, rgba(148, 163, 184, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
    }

    .dark .dashboard-grid-bg {
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.5",
    "recharts": "https://aistudiocdn.com/recharts@^3.3.0"
  }
}
</script>
</head>

<body class="bg-slate-50 dark:bg-dark-bg">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
