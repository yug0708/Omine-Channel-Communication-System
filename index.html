  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }

    /* ── Page entry animation ─────────────────────── */
    @keyframes page-fade-up {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .page-enter { animation: page-fade-up 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

    /* ── Stagger children ─────────────────────────── */
    @keyframes stagger-in {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .stagger-item { animation: stagger-in 0.4s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .stagger-item:nth-child(1) { animation-delay: 0.05s; }
    .stagger-item:nth-child(2) { animation-delay: 0.10s; }
    .stagger-item:nth-child(3) { animation-delay: 0.15s; }
    .stagger-item:nth-child(4) { animation-delay: 0.20s; }
    .stagger-item:nth-child(5) { animation-delay: 0.25s; }
    .stagger-item:nth-child(6) { animation-delay: 0.30s; }

    /* ── Slide in from right ──────────────────────── */
    @keyframes slide-in-right {
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .animate-slide-in-right {
      animation: slide-in-right 0.3s ease-out forwards;
    }

    @keyframes fade-in-up {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in-up {
      animation: fade-in-up 0.5s ease-out forwards;
    }

    .dashboard-mesh {
      background-image:
        radial-gradient(at 0% 0%, rgba(52, 211, 153, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(14, 165, 233, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
    }

    .dark .dashboard-mesh {
      background-image:
        radial-gradient(at 0% 0%, rgba(52, 211, 153, 0.15) 0px, transparent 45%),
        radial-gradient(at 100% 50%, rgba(59, 130, 246, 0.08) 0px, transparent 45%),
        radial-gradient(at 50% 100%, rgba(16, 185, 129, 0.06) 0px, transparent 45%);
    }

    .dashboard-grid-bg {
      background-size: 24px 24px;
      background-image: linear-gradient(to right, rgba(148, 163, 184, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
    }

    .dark .dashboard-grid-bg {
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
    .hide-scrollbar {
      scrollbar-width: none;        /* Firefox */
      -ms-overflow-style: none;     /* IE / Edge */
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;                /* Chrome / Safari / Opera */
    }
  </style>
